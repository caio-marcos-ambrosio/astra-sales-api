name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Evita dois deploys simultâneos; o segundo aguarda o primeiro terminar.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1) Testes (reexecutados a cada push na main, independentes do workflow de PR)
  # ---------------------------------------------------------------------------
  tests:
    name: Testes automatizados
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_NAME }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - ${{ secrets.POSTGRES_PORT }}:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mongodb:
        image: mongo:8.0.13
        env:
          # HARD CODE (CI): o MONGODB_URI é um único secret e não pode ser dividido
          # em usuário/senha aqui. Estes valores DEVEM ser idênticos aos da URI:
          # mongodb://mongo:DefaultPassword@localhost:27019/sales_mongo?authSource=admin
          MONGO_INITDB_ROOT_USERNAME: mongo
          MONGO_INITDB_ROOT_PASSWORD: DefaultPassword
        ports:
          # HARD CODE (CI): a porta do host deve ser a mesma da MONGODB_URI (27019).
          - 27019:27017
        options: >-
          --health-cmd "mongosh -u mongo -p DefaultPassword --authenticationDatabase admin --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Criar estrutura do PostgreSQL (init-db/01-schema.sql)
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          psql \
            --host "${{ secrets.POSTGRES_HOST }}" \
            --port "${{ secrets.POSTGRES_PORT }}" \
            --username "${{ secrets.POSTGRES_USER }}" \
            --dbname "${{ secrets.POSTGRES_NAME }}" \
            --set ON_ERROR_STOP=1 \
            --file init-db/01-schema.sql

      - name: Executar testes (Maven)
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_NAME: ${{ secrets.POSTGRES_NAME }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: mvn -B test

  # ---------------------------------------------------------------------------
  # 2) Build da imagem e publicação no Docker Hub (somente com testes aprovados)
  #    Build e push ficam no mesmo job porque a imagem local não é compartilhada
  #    entre jobs. Os steps são sequenciais: build -> login -> push.
  # ---------------------------------------------------------------------------
  publish-image:
    name: Build e publicação da imagem
    runs-on: ubuntu-latest
    needs: tests
    env:
      IMAGE: ${{ secrets.CD_DOCKER_USERNAME }}/sales-api:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imagem (Dockerfile da raiz)
        run: docker build --file Dockerfile --tag "$IMAGE" .

      - name: Autenticar no Docker Hub
        run: echo "${{ secrets.CD_DOCKER_PASSWORD }}" | docker login --username "${{ secrets.CD_DOCKER_USERNAME }}" --password-stdin

      - name: Publicar imagem (tag latest)
        run: docker push "$IMAGE"

  # ---------------------------------------------------------------------------
  # 3) Solicita o deployment ao Render (somente após a imagem publicada)
  # ---------------------------------------------------------------------------
  deploy-render:
    name: Deploy no Render
    runs-on: ubuntu-latest
    needs: publish-image

    steps:
      - name: Disparar deploy via API do Render
        run: |
          curl --silent --show-error --fail-with-body \
            --request POST \
            --url "https://api.render.com/v1/services/${{ secrets.CD_RENDER_SERVICE_ID }}/deploys" \
            --header "Authorization: Bearer ${{ secrets.CD_RENDER_API_KEY }}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data '{}'